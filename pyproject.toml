[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haola-checkup"
version = "1.0.0"
description = "好啦体检 Skill 与客户端：按预算和健康状况生成体检方案并完成预约（调用好啦体检 MCP，仅免登录工具）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "北京好啦科技有限公司 (Haola Tech)", email = "contacts@haola.com" }]
keywords = ["mcp", "healthcare", "checkup", "体检", "agent-skill", "booking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://www.ihaola.com.cn/"
Repository = "https://github.com/Beijing-Haola-Tech/haola-checkup-mcp"
Documentation = "https://www.ihaola.com.cn/llms.txt"

[project.scripts]
haola-checkup = "haola_checkup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/haola_checkup"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "skills/",
  "README.md",
  "LICENSE",
  "tools/",
  "examples/",
]
